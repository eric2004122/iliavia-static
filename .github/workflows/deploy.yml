# 讀取 Google 共編文件 → 產生靜態網站 → 發布到 GitHub Pages。
# 兩種更新方式並存：
#   自動：每 15 分鐘檢查一次，只有內容真的變了才重新發布。
#   手動：管理員在網站的「管理員：更新網站」頁（/admin/）按「更新網站」，
#         或在 GitHub「Actions」頁面按「Run workflow」，馬上重新讀取並發布。推送程式到 main 也會重新發布。
# 第一次要到 repo → Settings → Pages，把 Source 設成「GitHub Actions」。
# Variables（選填，repo → Settings → Secrets and variables → Actions → Variables）：
#   SEARCH_INDEXING（設 1 才讓搜尋引擎收錄）、CONTACT_EMAIL、SITE_URL
name: 更新並發布網站

on:
  push:
    branches: [main]
  schedule:
    # 每 15 分鐘檢查一次；避開整點，GitHub 尖峰時段仍可能延遲幾分鐘
    # 改頻率時，src/views.mjs 裡的「約每 15 分鐘」也要一起改
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # 取得 Pages 網址；專案網站的網址前面會多一段 /repo名稱/
      - id: pages
        uses: actions/configure-pages@v5

      - name: 取回上一次的內容與原圖
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      # GITHUB_REPOSITORY（帳號/repo）由 GitHub 自動提供，管理頁的更新按鈕要用
      - name: 讀取 Google 文件並產生網站
        id: build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          SEARCH_INDEXING: ${{ vars.SEARCH_INDEXING }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: node build.mjs

      - name: 打包網站
        if: steps.build.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 發布成功後才保存這次的內容，所以先交給 deploy 工作
      - name: 暫存這次的內容與原圖
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-state
          path: .state
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 取出這次的內容與原圖
        if: needs.build.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-state
          path: .state

      # 發布成功才保存，下一次才會拿這次的內容比對
      - name: 保存這次的內容與原圖
        if: needs.build.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
